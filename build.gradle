// GameTests remain available to development runs but are never shipped to players.
tasks.named('jar', Jar) {
    exclude('**/*GameTests*.class')
}

tasks.register('verifyProductionJar') {
    dependsOn tasks.named('jar')
    def artifact = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(artifact)
    doLast {
        def leakedTests = []
        def archive = new java.util.zip.ZipFile(artifact.get().asFile)
        try {
            archive.entries().each { entry ->
                if ((entry.name.contains('GameTests') && entry.name.endsWith('.class'))
                        || entry.name.endsWith('.py'))
                    leakedTests.add(entry.name)
            }
        } finally {
            archive.close()
        }
        if (!leakedTests.isEmpty())
            throw new GradleException("Development-only files in production JAR: ${leakedTests}")
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifySocialSystem'), tasks.named('verifyProductionJar')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
