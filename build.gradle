plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.11, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            def copyWorld = providers.gradleProperty('phase10ClientWorld').orNull
            if (copyWorld != null) {
                if (!(copyWorld ==~ /phase10-client-[a-f0-9]{32}/)
                        || !project.file("run/saves/${copyWorld}/phase10-copy-audit.nbt").isFile()) {
                    throw new GradleException('phase10ClientWorld must be a prepared, verified migration-copy world')
                }
                programArguments.addAll '--quickPlaySingleplayer', copyWorld
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            def discoveryRun = providers.gradleProperty('societyDiscoveryRun').orNull
            if (discoveryRun != null) {
                if (!(discoveryRun ==~ /[A-Za-z0-9_-]{1,64}/)) throw new GradleException('societyDiscoveryRun must be an isolated label')
                gameDirectory = project.file("run/society-discovery/${discoveryRun}")
                systemProperty 'sagadyssey.society.discovery', providers.gradleProperty('p2Discovery').orElse('false').get() == 'true' ? 'false' : 'true'
                systemProperty 'sagadyssey.p2.discovery', providers.gradleProperty('p2Discovery').orElse('false').get()
            }
            def copyRun = providers.gradleProperty('phase10MigrationRun').orNull
            if (copyRun != null) {
                if (!(copyRun ==~ /[A-Za-z0-9_-]{1,64}/)) {
                    throw new GradleException('phase10MigrationRun must be an isolated directory label')
                }
                def copyPhase = providers.gradleProperty('phase10MigrationPhase').orElse('apply').get()
                if (!(copyPhase in ['apply', 'restart', 'rollback'])) {
                    throw new GradleException('phase10MigrationPhase must be apply, restart or rollback')
                }
                gameDirectory = project.file("run/phase10-migration/${copyRun}")
                systemProperty 'sagadyssey.phase10.copyAudit', copyPhase
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            // Evidence emits INFO receipts; suppress per-tick DEBUG chatter only in this test runner.
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'sagadyssey.pickaxe.enabled', providers.gradleProperty('pickaxeBatchOnly').orElse('false').get()
            systemProperty 'sagadyssey.pickaxe.phase', providers.gradleProperty('pickaxeBatchPhase').orElse('disabled').get()
            systemProperty 'sagadyssey.cancelled.enabled', providers.gradleProperty('cancelRecoveryOnly').orElse('false').get()
            systemProperty 'sagadyssey.cancelled.phase', providers.gradleProperty('cancelRecoveryPhase').orElse('disabled').get()
            systemProperty 'sagadyssey.industry.native', (providers.gradleProperty('completionOnly').orElse('false').get() == 'true' ? 'true' : providers.gradleProperty('industryABOnly').orElse('false').get())
            systemProperty 'sagadyssey.completion.phase', providers.gradleProperty('completionPhase').orElse('disabled').get()
            systemProperty 'sagadyssey.industry.ab.phase', providers.gradleProperty('industryABPhase').orElse('disabled').get()
            systemProperty 'sagadyssey.industries.enabled', providers.gradleProperty('industriesOnly').orElse('false').get()
            systemProperty 'sagadyssey.industries.phase', providers.gradleProperty('industryPhase').orElse('baseline').get()
            systemProperty 'sagadyssey.industries.forestry', (providers.gradleProperty('completionPhase').orElse('disabled').get().startsWith('wood') || providers.gradleProperty('industryPhase').orElse('baseline').get().startsWith('forest')) ? 'true' : 'false'
            systemProperty 'sagadyssey.development.phase', providers.gradleProperty('developmentPhase').orElse('init').get()
            // 阶段4真实游戏验收使用独立目录，不读取或覆盖玩家的客户端世界。
            // A paired stage9 verification gets a fresh isolated world for its baseline;
            // its restart reuses exactly that directory. Keep all earlier test worlds intact.
            def phase9RunId = providers.gradleProperty('phase9GameTestRun').orNull
            if (phase9RunId != null && !(phase9RunId ==~ /[A-Za-z0-9_-]{1,64}/)) {
                throw new GradleException('phase9GameTestRun must be a safe directory label, not a path')
            }
            gameDirectory = project.file(phase9RunId == null ? 'run/phase4-gametest'
                    : "run/phase9-gametest/${phase9RunId}")
            def restartFrom = providers.gradleProperty('gameTestRestartFrom').orNull
            if (restartFrom != null) {
                if (phase9RunId == null || !(restartFrom ==~ /[A-Za-z0-9_-]{1,64}/) || restartFrom == phase9RunId) {
                    throw new GradleException('gameTestRestartFrom requires a separate isolated phase9GameTestRun label')
                }
                def runsDirectory = project.file('run/phase9-gametest').canonicalFile.toPath()
                def stoppedWorld = project.file("run/phase9-gametest/${restartFrom}/gametestserver/gametestworld").canonicalFile
                if (!stoppedWorld.toPath().startsWith(runsDirectory) || !new File(stoppedWorld, 'level.dat').isFile()) {
                    throw new GradleException('gameTestRestartFrom requires a stopped 1.21.11 GameTest world')
                }
                systemProperty 'sagadyssey.gametest.restartFrom', stoppedWorld.absolutePath
            }
            systemProperty 'sagadyssey.phase4.requireRestart', providers.gradleProperty('phase4RequireRestart').orElse('false').get()
            systemProperty 'sagadyssey.nearCycle.phase', providers.gradleProperty('nearCyclePhase').orElse('baseline').get()
            systemProperty 'sagadyssey.phase9.soak', providers.gradleProperty('phase9Soak').orElse('false').get()
            systemProperty 'sagadyssey.safety.phase', providers.gradleProperty('safetyPhase').orElse('baseline').get()
            systemProperty 'sagadyssey.playability.phase', providers.gradleProperty('playabilityPhase').orElse('all').get()
            systemProperty 'sagadyssey.redesign.guardOnly', providers.gradleProperty('redesignGuardOnly').orElse('false').get()
            systemProperty 'sagadyssey.phase10.profile', providers.gradleProperty('phase10Profile').orElse('false').get()
            systemProperty 'sagadyssey.phase10.soak', providers.gradleProperty('phase10Soak').orElse('false').get()
            systemProperty 'sagadyssey.society.phase', providers.gradleProperty('societyPhase').orElse('r1-init').get()
            systemProperty 'sagadyssey.handoff.phase', providers.gradleProperty('handoffPhase').orElse('disabled').get()
            systemProperty 'sagadyssey.tools.phase', providers.gradleProperty('toolsPhase').orElse('disabled').get()
            systemProperty 'sagadyssey.seeds.phase', providers.gradleProperty('seedsPhase').orElse('disabled').get()
            systemProperty 'sagadyssey.naturalRegistration.phase', providers.gradleProperty('naturalRegistrationPhase').orElse('baseline').get()
            // Opt-in isolated regression run; normal runs also discover the new tests.
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    providers.gradleProperty('completionOnly').orElse('false').get() == 'true' ? 'sagadyssey_industries_completion' :
                    providers.gradleProperty('pickaxeBatchOnly').orElse('false').get() == 'true' ? 'sagadyssey_pickaxe_batches' :
                    providers.gradleProperty('cancelRecoveryOnly').orElse('false').get() == 'true' ? 'sagadyssey_cancelled_recovery' :
                    providers.gradleProperty('industryABOnly').orElse('false').get() == 'true' ? 'sagadyssey_industries_ab' :
                    providers.gradleProperty('industriesOnly').orElse('false').get() == 'true' ? 'sagadyssey_industries' :
                    providers.gradleProperty('developmentOnly').orElse('false').get() == 'true' ? 'sagadyssey_development' :
                    providers.gradleProperty('resilienceOnly').orElse('false').get() == 'true' ? 'sagadyssey_resilience' :
                    providers.gradleProperty('playabilityFixOnly').orElse('false').get() == 'true' ? 'sagadyssey_playability_fix' :
                    providers.gradleProperty('safetyOnly').orElse('false').get() == 'true' ? 'sagadyssey_safety' :
                    providers.gradleProperty('redesignOnly').orElse('false').get() == 'true'
                            ? 'sagadyssey_redesign' :
                    providers.gradleProperty('seedsOnly').orElse('false').get() == 'true'
                            ? 'sagadyssey_seeds' :
                    providers.gradleProperty('toolsOnly').orElse('false').get() == 'true'
                            ? 'sagadyssey_tools' :
                    providers.gradleProperty('handoffOnly').orElse('false').get() == 'true'
                            ? 'sagadyssey_handoff' : providers.gradleProperty('societyOnly').orElse('false').get() == 'true'
                            ? (providers.gradleProperty('societyPhase').orElse('r1-init').get().startsWith('p8') ? 'sagadyssey_p8' : providers.gradleProperty('societyPhase').orElse('r1-init').get().startsWith('p7') ? 'sagadyssey_p7' : providers.gradleProperty('societyPhase').orElse('r1-init').get().startsWith('p6') ? 'sagadyssey_p6' : providers.gradleProperty('societyPhase').orElse('r1-init').get().startsWith('p5') ? 'sagadyssey_p5' : providers.gradleProperty('societyPhase').orElse('r1-init').get().startsWith('p4') ? 'sagadyssey_p4' : providers.gradleProperty('societyPhase').orElse('r1-init').get().startsWith('p3') ? 'sagadyssey_p3' : providers.gradleProperty('societyPhase').orElse('r1-init').get().startsWith('p2') ? 'sagadyssey_p2' : providers.gradleProperty('societyPhase').orElse('r1-init').get().startsWith('r3') ? 'sagadyssey_society_r3' : providers.gradleProperty('societyPhase').orElse('r1-init').get().startsWith('r2') ? 'sagadyssey_society_r2' : 'sagadyssey_society_r1') : providers.gradleProperty('naturalRegistrationOnly').orElse('false').get() == 'true'
                            ? 'sagadyssey_natural' : providers.gradleProperty('nearCycleOnly').orElse('false').get() == 'true'
                            ? 'sagadyssey_cycle' : providers.gradleProperty('stockReconciliationOnly').orElse('false').get() == 'true'
                            ? 'sagadyssey_stock' : project.mod_id + ',sagadyssey_stock'
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = (providers.gradleProperty('industriesOnly').orElse('false').get() == 'true' || providers.gradleProperty('societyOnly').orElse('false').get() == 'true' || providers.gradleProperty('nearCycleOnly').orElse('false').get() == 'true') ? org.slf4j.event.Level.INFO : org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Put the Minecraft and NeoForge runtime on the JUnit classpath so migration
    // tests can deserialize frozen legacy SavedData fixtures rather than merely
    // checking their filenames and hashes.
    unitTest {
        enable()
        testedMod = mods.sagadyssey
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // World simulation v2 uses real executable tests instead of source-text-only guards.
    testImplementation "org.junit.jupiter:junit-jupiter:5.14.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Fast, headless regression guard for the cross-system social simulation.
// It deliberately does not launch a Minecraft client or dedicated server.
tasks.register('verifySocialSystem') {
    group = 'verification'
    description = 'Checks social-system wiring, bounded C2S codecs, and resource JSON without launching Minecraft.'

    def javaRoot = new File(projectDir, 'src/main/java/com/jgeted/sagadyssey')
    def requiredSources = [
            'social/character/CharacterLifecycleEvents.java',
            'social/character/CharacterRegistryData.java',
            'social/settlement/SettlementRegistryData.java',
            'social/politics/PoliticalStateData.java',
            'social/logistics/LogisticsData.java',
            'social/economy/SettlementEconomyEvents.java',
             'social/world/WorldDynamicsEvents.java',
             'social/scenario/FixedScenarioDefinition.java',
            'social/scenario/FixedScenarioDeployment.java',
            'social/scenario/FixedScenarioData.java',
            'social/scenario/FixedScenarioEvents.java',
            'social/scenario/ScenarioLabController.java',
            'social/scenario/FixedScenarioVerifier.java',
            'social/scenario/FixedScenarioCommand.java',
            'social/SocialSystemAuditCommand.java',
            'npc/ai/InteractionApproach.java',
            'npc/ai/MovementProgress.java',
            'npc/ai/NpcGroundItemRecoveryGoal.java',
            'npc/work/NpcWorkstationContainers.java',
            'social/work/NpcWorkContext.java',
            'social/life/NpcLifeData.java',
            'social/life/NpcLifeRecord.java',
            'social/life/NpcResidenceFixtures.java',
            'social/life/NpcLifeBehavior.java',
            'social/life/NpcLongTermGoal.java',
            'social/life/NpcRelationKind.java',
            'social/life/NpcRelationRecord.java',
            'social/life/NpcMemoryRecord.java',
            'social/life/NpcAgencyDecision.java',
            'social/life/NpcActionDecisionRecord.java',
            'social/life/NpcNeedsRecord.java',
            'social/life/NpcFoodItems.java',
            'social/life/NpcScheduleActivity.java',
            'social/life/NpcScheduleRecord.java',
            'social/life/NpcSchedulePlanner.java',
            'social/life/NpcContractStatus.java',
            'social/life/NpcEmploymentContract.java',
            'social/life/NpcContractEvents.java',
            'social/life/NpcWorkZoneRecord.java',
            'social/household/HouseholdRole.java',
            'social/household/HouseholdMemberRecord.java',
            'social/household/HouseholdRecord.java',
            'social/household/HouseholdData.java',
            'social/household/HouseholdCareRecord.java',
            'social/household/HouseholdCareEvents.java',
            'social/household/HouseholdFixtures.java',
            'social/household/HouseholdCommand.java',
            'npc/ai/NpcHomeSleepGoal.java',
            'npc/ai/NpcEatGoal.java',
            'npc/ai/NpcHouseholdCareGoal.java',
            'npc/command/NpcLifeCommand.java'
    ].collect { new File(javaRoot, it) }
    def mainSourceFile = new File(javaRoot, 'Sagadyssey.java')
    def networkingFile = new File(javaRoot, 'core/network/SagadysseyNetworking.java')
    def farmerGoalFile = new File(javaRoot, 'npc/ai/FarmerWorkGoal.java')
    def npcBaseFile = new File(javaRoot, 'npc/entity/NpcBase.java')
    def patrolGoalFile = new File(javaRoot, 'npc/ai/PatrolGoal.java')
    def vehicleHandlerFile = new File(javaRoot, 'vehicle/VehicleEventHandler.java')
    def boundedPacketFiles = [
            'core/network/ChatPayload.java',
            'core/network/ResearchUnlockPacket.java',
            'npc/network/NpcInteractionPacket.java',
            'npc/network/NpcProfessionPacket.java',
            'npc/network/NpcFarmModePacket.java',
            'npc/command/network/CommandGroupActionPacket.java'
    ].collect { new File(javaRoot, it) }
    def resourceJsonFiles = fileTree('src/main/resources') { include '**/*.json' }
    def aiGoalFiles = fileTree(new File(javaRoot, 'npc/ai')) { include '**/*.java' }
    inputs.files(requiredSources)
    inputs.files(mainSourceFile, networkingFile, farmerGoalFile, npcBaseFile,
            patrolGoalFile, vehicleHandlerFile, boundedPacketFiles)
    inputs.files(resourceJsonFiles)
    inputs.files(aiGoalFiles)

    doLast {
        requiredSources.each { source ->
            if (!source.isFile()) throw new GradleException("Missing social-system source: ${source}")
        }

        def mainSource = mainSourceFile.getText('UTF-8')
        ['CharacterLifecycleEvents', 'SettlementEconomyEvents', 'WorldDynamicsEvents',
         'FixedScenarioEvents', 'FixedScenarioCommand', 'SocialSystemAuditCommand', 'NpcLifeCommand',
         'NpcContractEvents', 'HouseholdCommand', 'HouseholdCareEvents'].each { registration ->
            if (!mainSource.contains(registration))
                throw new GradleException("Missing event/command registration: ${registration}")
        }

        def networking = networkingFile.getText('UTF-8')
        if (!networking.contains('PROTOCOL_VERSION = "13"'))
            throw new GradleException('Network protocol was not bumped for the current payload schema')

        boundedPacketFiles.each { packetFile ->
            def text = packetFile.getText('UTF-8')
            if (!text.contains('NetworkStrings.read'))
                throw new GradleException("Unbounded C2S string decoder: ${packetFile}")
        }

        def scenarioDefinition = new File(javaRoot,
                'social/scenario/FixedScenarioDefinition.java').getText('UTF-8')
        if (!scenarioDefinition.contains('new FarmSpec("wheat_west", "farmland", 224, 82, 9)')
                || !scenarioDefinition.contains('new FarmSpec("wheat_east", "farmland", 266, 42, 9)'))
            throw new GradleException('small_realm must retain its two validated 9x9 farm modules')
        if (!scenarioDefinition.contains('public int revision()')
                || !scenarioDefinition.contains('9, 304, createTerrain(farms)'))
            throw new GradleException('small_realm must expose and increment its persisted definition revision')
        if (!scenarioDefinition.contains('String factionId, String settlementKey'))
            throw new GradleException('Scenario NPCs must declare an explicit home settlement')

        def scenarioEvents = new File(javaRoot,
                'social/scenario/FixedScenarioEvents.java').getText('UTF-8')
        def structurePiece = new File(javaRoot,
                'core/structure/SagadysseyStructurePiece.java').getText('UTF-8')
        [scenarioEvents, structurePiece].each { placementSource ->
            if (!placementSource.contains('BlockIgnoreProcessor.STRUCTURE_BLOCK')
                    || !placementSource.contains('setIgnoreEntities(true)'))
                throw new GradleException('Structure placement must ignore template markers and entities')
        }
        if (!scenarioEvents.contains('npc.setWorkZone(min, max)'))
            throw new GradleException('Scenario farmers must receive an explicit work zone')
        if (!scenarioEvents.contains('npc.setFarmMode(FarmMode.CROP)'))
            throw new GradleException('Scenario wheat farmers must remain in crop-only mode')
        def farmerGoal = farmerGoalFile.getText('UTF-8')
        if (!farmerGoal.contains('FarmMode.AUTO || npc.getFarmMode() == FarmMode.CROP'))
            throw new GradleException('Crop farmers must propagate neighboring crops when filling empty farmland')
        if (!scenarioEvents.contains('removeLegacyTemplateMarkers')
                || !scenarioEvents.contains('filterBlocks(position, settings, Blocks.STRUCTURE_BLOCK)'))
            throw new GradleException('Scenario redeployment must remove legacy template markers precisely')

        def scenarioCommand = new File(javaRoot,
                'social/scenario/FixedScenarioCommand.java').getText('UTF-8')
        if (!scenarioCommand.contains('Commands.literal("verify")')
                || !scenarioCommand.contains('Commands.literal("repair")')
                || !scenarioCommand.contains('Commands.literal("confirm")')
                || !scenarioCommand.contains('Commands.literal("reclaim-drops")'))
            throw new GradleException('Scenario verification and confirmed repair commands are required')
        def scenarioLabs = new File(javaRoot,
                'social/scenario/ScenarioLabController.java').getText('UTF-8')
        ['blacksmith_lab', 'farmer_lab', 'worker_lab', 'trader_lab',
         'guard_lab', 'medic_lab', 'bard_lab', 'household_lab'].each { labId ->
            if (!scenarioDefinition.contains('"' + labId + '"'))
                throw new GradleException("Missing isolated scenario lab: ${labId}")
        }
        if (!scenarioCommand.contains('Commands.literal("test")')
                || !scenarioCommand.contains('Commands.literal("profiles")')
                || !scenarioCommand.contains('Commands.literal("reset")')
                || !scenarioLabs.contains('defaultProfile')
                || !scenarioLabs.contains('cancelOpenOrdersCreatedBy'))
            throw new GradleException('Scenario labs require observable and repeatable test profiles')
        def scenarioVerifierSource = new File(javaRoot,
                'social/scenario/FixedScenarioVerifier.java').getText('UTF-8')
        def labLifeSource = new File(javaRoot,
                'social/life/NpcLifeData.java').getText('UTF-8')
        def labHouseholdSource = new File(javaRoot,
                'social/household/HouseholdData.java').getText('UTF-8')
        if (!scenarioLabs.contains('playerManagedNpcs')
                || !scenarioLabs.contains('resetTransientState')
                || !labLifeSource.contains('actionDecisions.remove(npcId)')
                || !labHouseholdSource.contains('resetCareState'))
            throw new GradleException('Scenario reset must preserve player-managed NPCs and clear repeat-test state')
